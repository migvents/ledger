name: Ledger alerts
on:
  schedule:
    - cron: "15 17 * * *"   # 17:15 UTC daily (market checks skip nothing on weekends; plan/TOB days may be weekends)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography
      - run: python alerts.py
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GIST_ID: ${{ secrets.GIST_ID }}
          SYNC_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
      - name: Save state
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update alert state"
          git push
